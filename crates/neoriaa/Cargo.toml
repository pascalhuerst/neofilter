[package]
name = "neoriaa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NeoRIAA: RIAA pre-emphasis / de-emphasis plugin (CLAP + VST3)"

[lib]
name = "neoriaa"
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
neo-measure = { path = "../neo-measure" }
atomic_float = "1"

[dev-dependencies]
approx = "0.5"
proptest = "1"
realfft = "3"
# Same source as nih-plug's (debug builds install its aborting allocator).
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid" }
