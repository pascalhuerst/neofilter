name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  # Same list as nih-plug's own CI (baseview needs X11/xcb/GL, nih-plug the audio backends).
  LINUX_DEPS: >-
    libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev
    libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev
    libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    # The whole workspace takes a few minutes (calibration and RIAA design tests).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  bundle:
    name: bundle (${{ matrix.name }})
    needs: [fmt, clippy, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          # Build-only checks that the plugins still compile and bundle elsewhere.
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      # One -p per plugin: nih_plug_xtask does not accept several bare names.
      - name: Bundle NeoFilter, NeoRIAA and NeoMeter
        run: cargo xtask bundle -p neofilter -p neoriaa -p neometer --release
      - name: Check that all bundles exist
        shell: bash
        run: |
          set -euo pipefail
          for p in neofilter neoriaa neometer; do
            test -e "target/bundled/$p.clap"
            test -e "target/bundled/$p.vst3"
          done
      - name: Upload bundles
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: neofilter-suite-linux-x86_64
          path: target/bundled/
          if-no-files-found: error
