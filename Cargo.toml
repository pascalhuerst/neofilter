[workspace]
resolver = "2"
members = [
    "crates/neofilter-dsp",
    "crates/neofilter",
    "crates/neofilter-cli",
    "crates/neo-measure",
    "crates/neoriaa",
    "crates/neometer",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/pascalhuerst/neofilter"
rust-version = "1.80"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
