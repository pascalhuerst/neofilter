[workspace]
resolver = "2"
members = [
    "crates/neofilter-dsp",
    "crates/neofilter",
    "crates/neofilter-cli",
    "crates/neo-measure",
    "crates/neoriaa",
    "crates/neometer",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/pascalhuerst/neofilter"
rust-version = "1.80"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# Calibration tests run seconds of audio through the DSP; keep them quick in debug builds.
[profile.dev.package.neo-measure]
opt-level = 2
[profile.dev.package.neofilter-dsp]
opt-level = 2
[profile.dev.package.neofilter]
opt-level = 1
